name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # A CalVer release tag (ADR 0078) only creates its GitHub Release; the site is
    # deployed by the main push that carries the tag (git push --atomic origin main vX)
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege (ADR 0069): every job reads only; the deploy job alone may
# write Pages and mint the OIDC token, and the release job alone may create a
# GitHub Release. Actions are pinned to full commit SHAs.
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build:site needs every tag to find the latest release (ADR 0078)
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      # Root: the latest v20* release tag; /nightly/: this commit (ADR 0078)
      - name: Build release and nightly site
        run: pnpm run build:site

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './site'
          # v4+ skips dotfiles by default; keep /.well-known/security.txt (ADR 0068, 0077).
          include-hidden-files: true

  deploy:
    name: Deploy to Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: GitHub Release
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "Guidonica ${TAG#v}" --notes-file notes.md
